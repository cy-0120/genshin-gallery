<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Impact</title>
    <link rel="stylesheet" href="/src/styles.css">
    
</head>
<body>
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <!-- 생동감 있는 물결 파장 효과를 위한 필터 -->
            <filter id="wave-filter" x="-50%" y="-50%" width="200%" height="200%">
                <!-- 첫 번째 파동 레이어 - 빠른 파동 -->
                <feTurbulence baseFrequency="0.02 0.04" numOctaves="3" seed="1" result="turbulence1">
                    <animate attributeName="baseFrequency" 
                             values="0.02 0.04;0.035 0.065;0.02 0.04" 
                             dur="2.1s" 
                             repeatCount="1"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="turbulence1" scale="12" xChannelSelector="R" yChannelSelector="G" result="displacement1">
                    <animate attributeName="scale" values="12;20;12" dur="2.1s" repeatCount="1"/>
                </feDisplacementMap>
                
                <!-- 두 번째 파동 레이어 - 느린 파동 (깊이감 추가) -->
                <feTurbulence baseFrequency="0.01 0.02" numOctaves="2" seed="3" result="turbulence2">
                    <animate attributeName="baseFrequency" 
                             values="0.01 0.02;0.018 0.035;0.01 0.02" 
                             dur="2.1s" 
                             repeatCount="1"/>
                </feTurbulence>
                <feDisplacementMap in="displacement1" in2="turbulence2" scale="8" xChannelSelector="R" yChannelSelector="G" result="displacement2">
                    <animate attributeName="scale" values="8;14;8" dur="2.1s" repeatCount="1"/>
                </feDisplacementMap>
                
                <!-- 세 번째 파동 레이어 - 미세한 파동 (세밀함 추가) -->
                <feTurbulence baseFrequency="0.03 0.06" numOctaves="4" seed="5" result="turbulence3">
                    <animate attributeName="baseFrequency" 
                             values="0.03 0.06;0.05 0.09;0.03 0.06" 
                             dur="2.1s" 
                             repeatCount="1"/>
                </feTurbulence>
                <feDisplacementMap in="displacement2" in2="turbulence3" scale="6" xChannelSelector="R" yChannelSelector="G">
                    <animate attributeName="scale" values="6;10;6" dur="2.1s" repeatCount="1"/>
                </feDisplacementMap>
            </filter>
            <!-- 파장 효과를 위한 원형 필터 -->
            <filter id="ripple-wave-filter" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
                <feComponentTransfer>
                    <feFuncA type="discrete" tableValues="0 0.5 0.8 0.5 0"/>
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <radialGradient id="ripple-gradient">
                <stop offset="0%" stop-color="rgba(201, 169, 255, 0.6)" />
                <stop offset="50%" stop-color="rgba(106, 90, 205, 0.3)" />
                <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
            </radialGradient>
        </defs>
    </svg>
    <div class="background" id="background">
        <div class="starfield" id="starfield"></div>
    </div>
    <a href="https://genshin.hoyoverse.com/ko" target="_blank" class="title">
        <div class="title-line title-main">Genshin</div>
        <div class="title-line title-sub">Impact</div>
    </a>

    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool@latest'></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
